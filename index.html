<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>桌面</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation;position:fixed;width:100%}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#fff;color:#111}
#home{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.home-topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 20px 14px}
.home-page-indicator{display:flex;gap:6px;align-items:center}
.home-page-indicator .dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.2);cursor:pointer;transition:all .2s}
.home-page-indicator .dot.active{width:20px;border-radius:4px;background:rgba(0,0,0,.7)}
.home-edit-btn{background:rgba(0,0,0,.06);color:#111;border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.home-edit-btn.on{background:#07c160;color:#fff;border-color:#07c160}
.home-pages{flex:1;position:relative;overflow:hidden;width:100%;min-height:0}
.home-page{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;padding:0 20px calc(30px + env(safe-area-inset-bottom));transform:translateX(100%);transition:transform .16s cubic-bezier(.22,.61,.36,1);visibility:hidden;backface-visibility:hidden}
.home-page::-webkit-scrollbar{display:none}
.home-page.active{transform:translateX(0);visibility:visible;z-index:2}
.home-page.next{transform:translateX(100%);visibility:visible;z-index:1}
.home-page.prev{transform:translateX(-100%);visibility:visible;z-index:1}
.widget,.couple-widget,.anniversary-widget{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);border-radius:22px;padding:18px 20px;margin-bottom:16px}
.widget{display:flex;justify-content:space-between;align-items:center}
.clock-time{font-size:34px;font-weight:700}.clock-date{font-size:12px;color:#666;margin-top:2px}
.grid-title{font-size:12px;color:#666;margin-bottom:12px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.app-cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.app-ico{width:54px;height:54px;border-radius:16px;background:#fff;color:#555b63;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.app-ico svg{width:26px;height:26px}
.app-label{font-size:11px;color:#666}
.couple-widget{display:flex;flex-direction:column;align-items:center;gap:10px}
.couple-avatars{display:flex;justify-content:center;align-items:center;padding:4px 0}
.couple-avatar{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#888;overflow:hidden;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.couple-avatar:first-child{z-index:2}
.couple-avatar:last-child{margin-left:-22px;z-index:1}
.couple-avatar img{width:100%;height:100%;object-fit:cover}
.couple-avatar svg{width:30px;height:30px}
.couple-text{font-size:13px;color:#666;letter-spacing:2px}
.music-home-widget{background:rgba(0,0,0,.85);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:16px}
.mhw-cover{width:48px;height:48px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.mhw-cover svg{width:22px;height:22px;color:rgba(255,255,255,.4)}
.mhw-info{flex:1;min-width:0}
.mhw-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhw-artist{font-size:11px;color:#a0a0a0;margin-top:2px}
.mhw-controls{display:flex;align-items:center;gap:10px}
.mhw-controls svg{width:16px;height:16px;cursor:pointer;color:#fff}
.mhw-controls .mhw-play{width:22px;height:22px}
.mhw-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mhw-wave{display:flex;align-items:center;gap:2px;height:14px}
.mhw-wave span{width:2px;background:#07c160;border-radius:1px;animation:mhwWave 1s ease-in-out infinite}
.mhw-wave span:nth-child(1){height:6px}
.mhw-wave span:nth-child(2){height:12px;animation-delay:.15s}
.mhw-wave span:nth-child(3){height:8px;animation-delay:.3s}
.mhw-wave span:nth-child(4){height:14px;animation-delay:.45s}
.mhw-wave span:nth-child(5){height:5px;animation-delay:.6s}
@keyframes mhwWave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
.mhw-together{font-size:9px;color:#a0a0a0;text-align:right;white-space:nowrap}
.anniversary-widget{display:flex;justify-content:space-between;align-items:center;gap:12px}
.aw-left{text-align:center;cursor:pointer}
.aw-label{font-size:14px;color:#666;font-weight:500}
.aw-value{font-size:14px;font-weight:600;color:#111;margin-top:2px}
.aw-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.aw-input-row{display:flex;align-items:center;gap:8px}
.aw-avatar{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#888;overflow:hidden}
.aw-avatar svg{width:18px;height:18px}
.aw-input-box{border:1px dashed rgba(0,0,0,.3);border-radius:12px;padding:7px 14px;font-size:12px;color:#666;cursor:pointer;min-width:90px;text-align:center;background:rgba(0,0,0,.02);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw-input-box.has-text{border-style:solid;color:#111;background:rgba(0,0,0,.06)}
.home-empty-tip{text-align:center;color:rgba(0,0,0,.35);font-size:13px;padding:60px 20px;line-height:1.8}
.home-page.editing .app-cell,.home-page.editing .widget,.home-page.editing .couple-widget,.home-page.editing .music-home-widget,.home-page.editing .anniversary-widget{position:relative;animation:homeWiggle .35s ease-in-out infinite alternate}
.home-page.editing .app-cell::before,.home-page.editing .widget::before,.home-page.editing .couple-widget::before,.home-page.editing .music-home-widget::before,.home-page.editing .anniversary-widget::before{content:"";position:absolute;inset:-2px;border:2px dashed rgba(0,0,0,.4);border-radius:18px;background:rgba(0,0,0,.05);z-index:200;cursor:pointer}
.home-page.editing .app-cell::after,.home-page.editing .widget::after,.home-page.editing .couple-widget::after,.home-page.editing .music-home-widget::after,.home-page.editing .anniversary-widget::after{content:"⇄";position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:#ff3b30;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;z-index:210;pointer-events:none}
@keyframes homeWiggle{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
#home.theme-dark{background:#111;color:#fff}
#home.theme-dark .widget,#home.theme-dark .couple-widget,#home.theme-dark .anniversary-widget{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
#home.theme-dark .clock-time,#home.theme-dark .aw-value{color:#fff}
#home.theme-dark .clock-date,#home.theme-dark .grid-title,#home.theme-dark .app-label,#home.theme-dark .aw-label{color:rgba(255,255,255,.6)}
#home.theme-dark .app-ico{background:rgba(255,255,255,.92);color:#111}
#home.theme-dark .home-edit-btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
#home.theme-dark .home-page-indicator .dot{background:rgba(255,255,255,.3)}
#home.theme-dark .home-page-indicator .dot.active{background:rgba(255,255,255,.9)}
#home.theme-dark .couple-avatar{background:rgba(255,255,255,.15);color:rgba(255,255,255,.75);border-color:#111}
#home.theme-dark .couple-text,#home.theme-dark .aw-input-box{color:rgba(255,255,255,.7)}
#home.theme-dark .aw-avatar{background:rgba(255,255,255,.15);color:rgba(255,255,255,.75)}
#home.theme-dark .aw-input-box{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
#home.has-bg::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.78);z-index:0;pointer-events:none}
#home.theme-dark.has-bg::before{background:rgba(0,0,0,.55)}
#home.has-bg>*{position:relative;z-index:1}
.modal{position:fixed;inset:0;z-index:200;background:#fff;display:none;flex-direction:column}
.modal.open{display:flex}
.modal-bar{padding:20px;padding-top:calc(20px + env(safe-area-inset-top));border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}
.modal-bar button{width:36px;height:36px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-bar svg{width:20px;height:20px}
.modal-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.modal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.wx-container{position:absolute;inset:0;display:flex;flex-direction:column;background:#f5f6f8}
.wx-header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-header-title{font-size:17px;font-weight:600}
.wx-header-actions svg{width:22px;height:22px;cursor:pointer}
.wx-content{flex:1;overflow-y:auto;background:#fff}
.wx-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.wx-avatar{width:44px;height:44px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex-shrink:0;overflow:hidden}
.wx-avatar img{width:100%;height:100%;object-fit:cover}
.wx-info{flex:1;min-width:0}
.wx-name{font-size:15px;font-weight:500}
.wx-preview{font-size:13px;color:#8b9198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wx-time{font-size:11px;color:#b0b0b0}
.wx-badge{background:#ff3b30;color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}
.wx-bottom-bar{display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
.wx-bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:#8b9198;cursor:pointer;border:0;background:none;font-family:inherit}
.wx-bottom-tab svg{width:22px;height:22px}
.wx-bottom-tab.active{color:#07c160}
.wx-chat-view{position:absolute;inset:0;background:#f5f6f8;display:flex;flex-direction:column;z-index:10;transform:translateX(100%);transition:transform .3s}
.wx-chat-view.open{transform:translateX(0)}
.wx-chat-header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-chat-header svg{width:22px;height:22px;cursor:pointer}
.wx-chat-header span{font-size:16px;font-weight:600;flex:1;text-align:center}
.wx-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background-size:cover;background-position:center}
.wx-msg-row{display:flex;gap:8px;max-width:80%}
.wx-msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.wx-msg-row.them{align-self:flex-start}
.wx-msg-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.wx-msg-avatar{width:36px;height:36px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden}
.wx-msg-avatar img{width:100%;height:100%;object-fit:cover}
.wx-msg-row.me .wx-msg-avatar{background:#2f6fed}
.wx-msg-meta{font-size:10px;color:#b0b0b0;text-align:center}
.wx-msg-meta .read{color:#07c160;display:block}
.wx-msg-body{display:flex;flex-direction:column;gap:3px}
.wx-msg-bubble{padding:10px 14px;font-size:15px;line-height:1.4;word-break:break-word;max-width:100%}
.wx-chat-input{display:flex;gap:6px;padding:8px 10px;background:#fff;border-top:1px solid #eee;padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:center;position:relative}
.wx-chat-input input{flex:1;border:0;background:#f5f6f8;border-radius:20px;padding:9px 14px;font-size:16px;outline:none;min-width:0}
.wx-chat-input .send-btn{background:#111418;color:#fff;border:0;border-radius:18px;padding:9px 18px;font-size:15px;cursor:pointer;font-weight:500}
.wx-chat-input .send-btn:disabled{opacity:.4}
.wx-input-extra{width:34px;height:34px;border-radius:50%;background:#f5f6f8;border:0;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.wx-moments-hero{position:relative;height:200px;overflow:hidden;background:linear-gradient(135deg,#e8e2f5,#d5e8ef,#e0f0e8)}
.wx-moments-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.wx-moments-hero .hero-icons{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;padding:0 16px;color:#fff;z-index:2}
.wx-moments-hero .hero-icons svg{width:24px;height:24px;cursor:pointer;margin-left:auto}
.wx-moments-hero .hero-avatar-row{position:absolute;bottom:14px;right:16px;display:flex;align-items:flex-end;gap:8px;z-index:2}
.wx-moments-hero .hero-avatar-row .nickname{color:#fff;font-size:17px;text-shadow:0 1px 4px rgba(0,0,0,.5);padding-bottom:8px}
.wx-moments-hero .hero-avatar-row .wx-avatar{width:70px;height:70px;min-width:70px;min-height:70px;aspect-ratio:1/1;flex-shrink:0;font-size:26px;border-radius:14px;border:3px solid #fff;background:#2f6fed}
.wx-moments-empty{padding:60px 20px;text-align:center;color:#c3c8ce;font-size:14px}
.wx-moment-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid #f0f0f0;background:#fff}
.wx-moment-avatar{width:44px;height:44px;border-radius:10px;background:#2f6fed;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;flex-shrink:0;overflow:hidden}
.wx-moment-avatar img{width:100%;height:100%;object-fit:cover}
.wx-moment-content{flex:1;min-width:0}
.wx-moment-name{font-size:15px;font-weight:600;color:#576b95}
.wx-moment-text{font-size:15px;margin:6px 0;line-height:1.5}
.wx-moment-time{font-size:12px;color:#b0b0b0;margin-top:4px}
.wx-empty{padding:40px;text-align:center;color:#8b9198;font-size:13px}
.wx-bubble-menu{position:fixed;z-index:1300;background:#4c4c4c;border-radius:8px;padding:4px;display:flex}
.wx-bubble-menu .bm-item{color:#fff;font-size:14px;padding:7px 18px;cursor:pointer}
.wx-bubble-mask{position:fixed;inset:0;z-index:1250}
.wx-msg-bubble.sticker,.wx-msg-bubble.image{background:transparent!important;padding:0!important}
.wx-msg-bubble.sticker img{max-width:140px;border-radius:10px;display:block}
.wx-msg-bubble.image img{max-width:200px;border-radius:10px;display:block;object-fit:cover}
.wx-transfer-card{background:#f5a623;color:#fff;border-radius:14px;padding:14px 18px;min-width:200px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.wx-transfer-card.done{background:#a0a0a0}
.wx-transfer-card.red-packet{background:#e05a5a}
.wx-transfer-card.red-packet.done{background:#a0a0a0}
.wx-transfer-card .wt-top{display:flex;align-items:center;gap:10px;font-size:14px}
.wx-transfer-card .wt-top svg{width:22px;height:22px}
.wx-transfer-card .wt-amount{font-size:22px;font-weight:700}
.wx-transfer-card .wt-note{font-size:12px;opacity:.9}
.wx-question-card{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:14px;min-width:230px}
.wx-question-card .qq-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.wx-question-card .qq-title svg{width:18px;height:18px;color:#2f6fed}
.wx-question-card .qq-q{font-size:13px;margin:8px 0 6px}
.wx-question-card .qq-opt{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 0;cursor:pointer}
.wx-question-card .qq-text{width:100%;border:1px solid #e2e5e9;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;margin-top:4px;box-sizing:border-box}
.wx-question-card .qq-submit{width:100%;margin-top:10px;padding:8px 0;border:0;border-radius:10px;background:#2f6fed;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.wx-question-card .qq-done{font-size:12px;color:#07c160;margin-top:8px;text-align:center}
.wx-pat-tip{font-size:12px;color:#8b9198;text-align:center;padding:4px 0}
.wx-call-card{background:rgba(0,0,0,.06);color:#666;border-radius:16px;padding:9px 16px;display:inline-flex;align-items:center;gap:8px;font-size:14px;max-width:100%}
.wx-call-card svg{width:16px;height:16px;flex-shrink:0;color:#666}
.wx-extra-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:20;transform:translateY(100%);transition:transform .25s}
.wx-extra-panel.show{transform:translateY(0)}
.wx-extra-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}
.wx-extra-mask.show{display:block}
.wx-extra-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px}
.wx-extra-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.wx-extra-item .we-ico{width:52px;height:52px;border-radius:14px;background:#f5f6f8;display:flex;align-items:center;justify-content:center;color:#333}
.wx-extra-item .we-ico svg{width:24px;height:24px}
.wx-extra-item .we-name{font-size:11px;color:#8b9198}
.wx-sticker-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));z-index:21;transform:translateY(100%);transition:transform .25s;max-height:60%;overflow-y:auto}
.wx-sticker-panel.show{transform:translateY(0)}
.wx-sticker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}
.wx-sticker-head .ws-title{font-size:14px;font-weight:600}
.wx-sticker-head .ws-add{font-size:13px;color:#2f6fed;cursor:pointer}
.wx-sticker-head .ws-close{margin-left:14px;font-size:13px;color:#8b9198;cursor:pointer;padding:4px 10px;border-radius:12px;background:#f5f6f8}
.wx-sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wx-sticker-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f5f6f8;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.wx-sticker-item img{width:100%;height:100%;object-fit:cover}
.wx-sticker-item .ws-del{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#ff3b30;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.wx-sticker-empty{grid-column:1/-1;text-align:center;color:#8b9198;font-size:13px;padding:30px 0}
.wx-sticker-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;cursor:pointer}
.wx-sticker-mask.show{display:block}
.settings-page{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:1000}
.settings-page.open{display:flex}
.settings-header{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;background:#fff}
.settings-header svg{width:22px;height:22px;cursor:pointer}
.settings-header .stitle{font-size:17px;font-weight:600;flex:1;text-align:center}
.settings-body{flex:1;overflow-y:auto;padding:16px;background:#f5f6f8}
.settings-block{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.settings-input{width:100%;border:1px solid #e2e5e9;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;font-family:inherit;background:#fff;margin-bottom:8px;box-sizing:border-box}
.settings-group-title{font-size:13px;color:#8b9198;font-weight:600;padding:6px 4px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;font-size:15px;border-bottom:1px solid #f0f0f0;background:#fff;gap:12px}
.settings-row:last-child{border-bottom:0}
.settings-row .sr-title{font-size:15px;color:#111}

function openChat(id){var chat=wxState.chats.find(function(c){return c.id===id});if(!chat)return;chat.unread=0;wxState.currentChat=chat;saveWxChat();document.getElementById('wxChatName').textContent=chat.name;document.getElementById('wxChatView').classList.add('open');document.getElementById('wxMsgInput').value='';document.getElementById('wxSendBtn').disabled=true;renderMsgs()}
function renderMsgs(){var chat=wxState.currentChat;if(!chat)return;var s=wxState.settings;var myAv=s.myAvatarUrl?'<img src="'+s.myAvatarUrl+'"/>':esc(s.myName.slice(0,1));var pa=s.partnerAvatarUrl?'<img src="'+s.partnerAvatarUrl+'"/>':esc(chat.name.slice(0,1));var html=chat.msgs.map(function(m){var av=m.me?myAv:pa;var body='';if(m.type==='text'){var bs='padding:10px 14px;font-size:14px;border-radius:14px;word-break:break-word;max-width:100%;';if(m.me)bs+='background:'+s.myBubbleColor+';color:'+s.myTextColor;else bs+='background:'+s.themBubbleColor+';color:'+s.themTextColor;body='<div class="wx-msg-bubble" style="'+bs+'">'+esc(m.text)+'</div>'}else if(m.type==='sticker'){body='<div class="wx-msg-bubble sticker"><img src="'+m.src+'"/></div>'}else if(m.type==='image'){body='<div class="wx-msg-bubble image"><img src="'+m.src+'"/></div>'}else if(m.type==='transfer'){var done=m.status==='done';var isRed=m.kind==='redpacket';var bg=done?'#a0a0a0':(isRed?s.redPacketColor:s.transferColor);body='<div class="wx-transfer-card'+(isRed?' red-packet':'')+'" style="background:'+bg+'" data-id="'+(m.id||'')+'"><div class="wt-top">'+esc(isRed?'红包':'转账')+'</div><div class="wt-amount">¥ '+esc(m.amount)+'</div><div class="wt-note">'+(done?'已领取':(isRed?'点击领取':'点击收款'))+'</div></div>'}else if(m.type==='call'){body='<div class="wx-call-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'+esc(m.text||'通话已结束')+'</div>'}else if(m.type==='pat'){return'<div class="wx-msg-row '+(m.me?'me':'them')+'" style="align-self:center;max-width:100%"><div class="wx-pat-tip">'+esc(m.text)+'</div></div>'}else if(m.type==='questionnaire'){body='<div class="wx-question-card"><div class="qq-title">'+esc(m.title)+'</div>'+m.questions.map(function(q,i){var h='<div class="qq-q">'+(i+1)+'. '+esc(q.title)+'</div>';if(q.type==='single'){q.options.forEach(function(o,oi){h+='<label class="qq-opt"><input type="radio" name="q'+m.id+'_'+i+'" value="'+oi+'"/>'+esc(o)+'</label>'})}else if(q.type==='multiple'){q.options.forEach(function(o,oi){h+='<label class="qq-opt"><input type="checkbox" value="'+oi+'"/>'+esc(o)+'</label>'})}else{h+='<input type="text" class="qq-text" placeholder="请输入..."/>'}return h}).join('')+'<button class="qq-submit" data-id="'+(m.id||'')+'">提交</button></div>'}return'<div class="wx-msg-row '+(m.me?'me':'them')+'"><div class="wx-msg-avatar-wrap"><div class="wx-msg-avatar" style="border-radius:'+(s.avatarShape==='方形'?'0':'50%')+'">'+av+'</div><div class="wx-msg-meta">'+m.time+(m.me?'<span class="read">'+(m.read?'已读':'未读')+'</span>':'')+'</div></div><div class="wx-msg-body">'+body+'</div></div>'}).join('');var el=document.getElementById('wxMessages');el.innerHTML=html;el.scrollTop=el.scrollHeight;if(chat.chatBgImg){el.style.backgroundImage='url('+chat.chatBgImg+')';el.style.backgroundSize='cover'}else{el.style.backgroundImage=''}}
function sendMsg(){var chat=wxState.currentChat;var inp=document.getElementById('wxMsgInput');var t=inp.value.trim();if(!t||!chat)return;chat.msgs.push({me:true,type:'text',text:t,time:nowTime(),read:false});chat.time=nowTime().slice(0,5);inp.value='';document.getElementById('wxSendBtn').disabled=true;saveWxChat();renderMsgs();setTimeout(function(){chat.msgs.forEach(function(m){if(m.me)m.read=true});saveWxChat();renderMsgs()},800);setTimeout(function(){var r=['收到','好的','嗯嗯','明白了','稍后回复','可以'];var reply=r[Math.floor(Math.random()*r.length)];chat.msgs.push({me:false,type:'text',text:reply,time:nowTime(),read:true});saveWxChat();if(wxState.currentChat===chat)renderMsgs();if(wxState.currentChat!==chat)chat.unread=(chat.unread||0)+1;if(wxState.currentTab==='chats')renderWxContent()},1500+Math.random()*1500)}
function chatSettings(){var chat=wxState.currentChat;if(!chat)return;var old=document.querySelector('.chat-settings-mask');if(old)old.remove();var s=wxState.settings;var h='<div class="chat-settings-mask" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1100;display:flex;align-items:flex-end;justify-content:center"><div style="background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px"><div style="text-align:center;font-weight:600;margin-bottom:16px">聊天设置</div><div class="settings-row" id="csBg"><div class="sr-title">聊天背景</div></div><div class="settings-row" id="csMyAv"><div class="sr-title">我的头像</div></div><div class="settings-row" id="csPaAv"><div class="sr-title">对方头像</div></div><button id="csClose" style="width:100%;padding:12px 0;margin-top:10px;border:0;border-radius:12px;background:#f5f6f8;font-size:15px;cursor:pointer;font-family:inherit">关闭</button></div></div>';document.body.insertAdjacentHTML('beforeend',h);document.getElementById('csClose').addEventListener('click',function(){document.querySelector('.chat-settings-mask').remove()});document.querySelector('.chat-settings-mask').addEventListener('click',function(e){if(e.target.classList.contains('chat-settings-mask'))this.remove()});document.getElementById('csBg').addEventListener('click',function(){pickImg(function(u){chat.chatBgImg=u;saveWxChat();renderMsgs()})});document.getElementById('csMyAv').addEventListener('click',function(){pickImg(function(u){s.myAvatarUrl=u;saveWxS();renderMsgs();renderWidgets()})});document.getElementById('csPaAv').addEventListener('click',function(){pickImg(function(u){s.partnerAvatarUrl=u;saveWxS();renderMsgs();renderWidgets()})})}
function extraPanel(){var old=document.querySelector('.wx-extra-mask');if(old)old.remove();var old2=document.querySelector('.wx-extra-panel');if(old2)old2.remove();var m=document.createElement('div');m.className='wx-extra-mask show';m.id='wxExtraMask';var p=document.createElement('div');p.className='wx-extra-panel show';p.id='wxExtraPanel';p.innerHTML='<div class="wx-extra-grid"><div class="wx-extra-item" data-act="sticker"><div class="we-ico">😀</div><div class="we-name">表情</div></div><div class="wx-extra-item" data-act="image"><div class="we-ico">🖼</div><div class="we-name">图片</div></div><div class="wx-extra-item" data-act="transfer"><div class="we-ico">💰</div><div class="we-name">转账</div></div><div class="wx-extra-item" data-act="redpacket"><div class="we-ico">🧧</div><div class="we-name">红包</div></div><div class="wx-extra-item" data-act="call"><div class="we-ico">📞</div><div class="we-name">电话</div></div><div class="wx-extra-item" data-act="pat"><div class="we-ico">👋</div><div class="we-name">拍一拍</div></div></div>';var cv=document.getElementById('wxChatView');cv.appendChild(m);cv.appendChild(p);m.addEventListener('click',closeAllPanels);p.querySelectorAll('.wx-extra-item').forEach(function(it){it.addEventListener('click',function(){var a=it.dataset.act;closeAllPanels();if(a==='sticker')stickerPanel();else if(a==='image')sendImg();else if(a==='transfer')transPopup('transfer');else if(a==='redpacket')transPopup('redpacket');else if(a==='call')startCall();else if(a==='pat')doPat('me')})})}
function closeAllPanels(){var a=document.querySelector('.wx-extra-mask');if(a)a.remove();var b=document.querySelector('.wx-extra-panel');if(b)b.remove();var c=document.getElementById('wxStickerMask');if(c)c.remove();var d=document.getElementById('wxStickerPanel');if(d)d.remove()}
function sendImg(){var chat=wxState.currentChat;if(!chat)return;var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){chat.msgs.push({me:true,type:'image',src:ev.target.result,time:nowTime(),read:false});saveWxChat();renderMsgs()};r.readAsDataURL(f)};i.click()}
function stickerPanel(){var old=document.getElementById('wxStickerPanel');if(old)old.remove();var oldM=document.getElementById('wxStickerMask');if(oldM)oldM.remove();var mask=document.createElement('div');mask.className='wx-sticker-mask show';mask.id='wxStickerMask';mask.addEventListener('click',closeAllPanels);var p=document.createElement('div');p.className='wx-sticker-panel show';p.id='wxStickerPanel';var g=stickerState.list.length?stickerState.list.map(function(s,i){return'<div class="wx-sticker-item" data-i="'+i+'"><img src="'+s+'"/></div>'}).join(''):'<div class="wx-sticker-empty">还没有表情</div>';p.innerHTML='<div class="wx-sticker-head"><div class="ws-title">表情</div><div><span class="ws-add" id="wsAdd">+ 添加</span><span class="ws-close" id="wsClose">收起</span></div></div><div class="wx-sticker-grid">'+g+'</div>';var cv=document.getElementById('wxChatView');cv.appendChild(mask);cv.appendChild(p);document.getElementById('wsAdd').addEventListener('click',function(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=function(e){var fs=Array.prototype.slice.call(e.target.files||[]);var ld=0;fs.forEach(function(f){var r=new FileReader();r.onload=function(ev){stickerState.list.push(ev.target.result);ld++;if(ld===fs.length){saveStickers();closeAllPanels();stickerPanel()}};r.readAsDataURL(f)})};i.click()});document.getElementById('wsClose').addEventListener('click',closeAllPanels);p.querySelectorAll('.wx-sticker-item').forEach(function(it){it.addEventListener('click',function(){var s=stickerState.list[parseInt(it.dataset.i,10)];if(!s)return;var chat=wxState.currentChat;if(!chat)return;chat.msgs.push({me:true,type:'sticker',src:s,time:nowTime(),read:false});saveWxChat();closeAllPanels();renderMsgs()})})}
function transPopup(kind){var isRed=kind==='redpacket';openPopup('<div class="wx-popup-title">'+(isRed?'发红包':'转账')+'</div><input class="wx-popup-input" id="tfa" type="number" placeholder="金额"/><div class="wx-popup-btns"><button class="wx-popup-btn cancel" id="tc">取消</button><button class="wx-popup-btn confirm" id="tk">发送</button></div>');document.getElementById('tc').addEventListener('click',closePopup);document.getElementById('tk').addEventListener('click',function(){var a=parseFloat(document.getElementById('tfa').value);if(!a||a<=0)return alert('请输入金额');var chat=wxState.currentChat;chat.msgs.push({me:true,type:'transfer',kind:kind,id:'tf'+Date.now(),amount:a.toFixed(2),status:'pending',time:nowTime(),read:false});saveWxChat();closePopup();renderMsgs()})}
function doPat(who){var chat=wxState.currentChat;if(!chat)return;var name=who==='me'?wxState.settings.myName:chat.name;chat.msgs.push({me:who==='me',type:'pat',text:'"'+name+'"拍了拍'+(who==='me'?'自己':'我'),time:nowTime(),read:true});saveWxChat();renderMsgs()}
document.addEventListener('click',function(e){var tc=e.target.closest('.wx-transfer-card');if(tc){var chat=wxState.currentChat;if(!chat)return;var id=tc.dataset.id;var m=chat.msgs.find(function(x){return x.id===id});if(!m||m.status==='done')return;if(!m.me){if(!confirm('确认收款 ¥ '+m.amount+' ?'))return;m.status='done';saveWxChat();renderMsgs()}}});
function startCall(){var chat=wxState.currentChat;if(!chat)return;var cs=document.getElementById('callScreen');cs.classList.add('open');document.getElementById('callAvatar').textContent=chat.name.slice(0,1);document.getElementById('callAvatar').style.background=chat.color;document.getElementById('callName').textContent=chat.name;document.getElementById('callStatus').textContent='正在呼叫...';var mini=document.getElementById('callMini');mini.classList.remove('show');document.getElementById('callMiniAvatar').textContent=chat.name.slice(0,1);document.getElementById('callMiniName').textContent=chat.name;callSeconds=0;setTimeout(function(){document.getElementById('callStatus').textContent='通话中 00:00';callTimer=setInterval(function(){callSeconds++;var t=String(Math.floor(callSeconds/60)).padStart(2,'0')+':'+String(callSeconds%60).padStart(2,'0');document.getElementById('callStatus').textContent='通话中 '+t;document.getElementById('callMiniStatus').textContent=t},1000)},1500)}
var callSeconds=0,callTimer=null;
document.getElementById('callEnd').addEventListener('click',function(){var cs=document.getElementById('callScreen');cs.classList.remove('open');document.getElementById('callMini').classList.remove('show');if(callTimer){clearInterval(callTimer);callTimer=null}var chat=wxState.currentChat;if(chat){var dur=callSeconds||0;chat.msgs.push({me:true,type:'call',duration:dur,text:'通话时长 '+String(Math.floor(dur/60)).padStart(2,'0')+':'+String(dur%60).padStart(2,'0'),time:nowTime(),read:true});saveWxChat();if(wxState.currentChat===chat)renderMsgs()}callSeconds=0});
document.addEventListener('click',function(e){if(e.target.closest('#callMin')){var m=document.getElementById('callMini');var cs=document.getElementById('callScreen');if(m&&cs){m.classList.add('show');cs.style.display='none'}return}if(e.target.closest('#callMini')&&!e.target.closest('#callMiniEnd')){var m2=document.getElementById('callMini');var cs2=document.getElementById('callScreen');if(m2&&cs2){m2.classList.remove('show');cs2.style.display='flex';cs2.classList.add('open')}return}if(e.target.closest('#callMiniEnd')){var m3=document.getElementById('callMini');var cs3=document.getElementById('callScreen');if(m3)m3.classList.remove('show');if(cs3){cs3.classList.remove('open');cs3.style.display=''}if(callTimer){clearInterval(callTimer);callTimer=null}callSeconds=0}});
function postMoment(){openPopup('<div class="wx-popup-title">发表动态</div><textarea class="wx-popup-input" id="pmT" style="min-height:100px;resize:none;font-family:inherit" placeholder="这一刻的想法..."></textarea><div class="wx-popup-btns"><button class="wx-popup-btn cancel" id="pmC">取消</button><button class="wx-popup-btn confirm" id="pmK">发表</button></div>');document.getElementById('pmC').addEventListener('click',closePopup);document.getElementById('pmK').addEventListener('click',function(){var t=document.getElementById('pmT').value.trim();if(!t)return;wxState.moments.unshift({id:'m'+Date.now(),name:wxState.settings.myName,color:'#2f6fed',text:t,time:'刚刚'});saveWxM();closePopup();renderWxContent()})}
function openZika(){var html='<div class="zika-container"><div class="zika-header"><div class="zika-back" id="zkBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div><div class="zika-title">字卡库</div></div><div class="zika-body"><div class="zika-actions"><button class="zika-action-btn" id="zkAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>添加</button><button class="zika-action-btn danger" id="zkClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>清空</button></div><input class="zika-search" id="zkSearch" placeholder="搜索字卡"/><div class="zika-list" id="zkList"></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);document.getElementById('zkBack').addEventListener('click',function(){document.querySelector('.zika-container').remove()});document.getElementById('zkAdd').addEventListener('click',function(){var t=prompt('字卡内容：');if(!t||!t.trim())return;zikaState.list.push({text:t.trim()});saveZika();renderZika()});document.getElementById('zkClear').addEventListener('click',function(){if(!confirm('清空全部？'))return;zikaState.list=[];saveZika();renderZika()});document.getElementById('zkSearch').addEventListener('input',function(){zikaState.search=this.value.trim();renderZika()});renderZika()}
function renderZika(){var el=document.getElementById('zkList');if(!el)return;var list=zikaState.list.slice();if(zikaState.search)list=list.filter(function(c){return c.text.indexOf(zikaState.search)>-1});if(!list.length){el.innerHTML='<div class="zika-empty">还没有字卡</div>';return}el.innerHTML=list.map(function(c,i){return'<div class="zika-card" data-i="'+i+'">'+esc(c.text)+'<button class="zika-del" data-i="'+i+'">×</button></div>'}).join('');el.querySelectorAll('.zika-del').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var i=parseInt(b.dataset.i,10);zikaState.list.splice(i,1);saveZika();renderZika()})});el.querySelectorAll('.zika-card').forEach(function(c){c.addEventListener('click',function(e){if(e.target.closest('.zika-del'))return;var t=c.firstChild.textContent.trim();try{navigator.clipboard.writeText(t)}catch(e){}})})}
function renderWidgets(){var av1=document.getElementById('homeAvatarLeft'),av2=document.getElementById('homeAvatarRight');if(av1&&av2){var s=wxState.settings;var def='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';av1.innerHTML=s.myAvatarUrl?'<img src="'+s.myAvatarUrl+'"/>':def;av2.innerHTML=s.partnerAvatarUrl?'<img src="'+s.partnerAvatarUrl+'"/>':def}var av=document.getElementById('anniversaryVal');if(av){var cds=extraState.countdowns||[];if(cds.length){var t0=new Date();t0.setHours(0,0,0,0);var near=cds[0];cds.forEach(function(c){if(Math.abs(new Date(c.date)-t0)<Math.abs(new Date(near.date)-t0))near=c});var lb=document.getElementById('awLabel');if(lb)lb.textContent=near.name;var d=Math.ceil((new Date(near.date+'T00:00:00')-t0)/86400000);av.textContent=d>=0?d:('已过'+Math.abs(d))}else{var lb2=document.getElementById('awLabel');if(lb2)lb2.textContent='纪念日';av.textContent='0'}}var i1=document.getElementById('awInput1'),i2=document.getElementById('awInput2');if(i1){i1.textContent=homeWidgetsState.input1||'点我输入';i1.classList.toggle('has-text',!!homeWidgetsState.input1)}if(i2){i2.textContent=homeWidgetsState.input2||'点我输入';i2.classList.toggle('has-text',!!homeWidgetsState.input2)}var aw=document.getElementById('awLeft');if(aw)aw.addEventListener('click',function(){document.querySelectorAll('.simple-app').forEach(function(x){x.remove()});openCountdown()});var i1b=document.getElementById('awInput1');if(i1b)i1b.addEventListener('click',function(){var v=prompt('第一行：',homeWidgetsState.input1);if(v===null)return;homeWidgetsState.input1=v.trim();saveHomeWidget();renderWidgets()});var i2b=document.getElementById('awInput2');if(i2b)i2b.addEventListener('click',function(){var v=prompt('第二行：',homeWidgetsState.input2);if(v===null)return;homeWidgetsState.input2=v.trim();saveHomeWidget();renderWidgets()})}
function tick(){var d=new Date();var ct=document.getElementById('clockTime');if(ct)ct.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');var cd=document.getElementById('clockDate');var w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];if(cd)cd.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+w}
