 cy='85' r='14'/%3E%3Cellipse cx='55' cy='75' rx='12' ry='8' transform='rotate(-30 55 75)'/%3E%3Cellipse cx='125' cy='75' rx='12' ry='8' transform='rotate(30 125 75)'/%3E%3Cellipse cx='90' cy='95' rx='32' ry='30'/%3E%3C/g%3E%3Ccircle cx='80' cy='92' r='3.5' fill='%23333'/%3E%3Ccircle cx='100' cy='92' r='3.5' fill='%23333'/%3E%3Cellipse cx='90' cy='105' rx='4' ry='3' fill='%23333'/%3E%3Ctext x='90' y='155' font-size='20' font-family='PingFang SC,sans-serif' font-weight='600' text-anchor='middle' fill='%23ffffff'%3Exiaoyang%3C/text%3E%3C/svg%3E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="桌面"><meta name="theme-color" content="#ff9ec7"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation;position:fixed;width:100%}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#fff;color:#111}
#home{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.home-topbar{flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding:calc(16px + env(safe-area-inset-top)) 20px 6px}
.home-page-indicator{display:none}
.home-edit-btn{background:rgba(0,0,0,.06);color:#111;border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.home-edit-btn.on{background:#07c160;color:#fff;border-color:#07c160}
.home-pages{flex:1;position:relative;overflow:hidden;width:100%;min-height:0;touch-action:none;overscroll-behavior:none}
.home-page{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;padding:0 14px calc(8px + env(safe-area-inset-bottom));transform:translate3d(0,0,0);transition:none;visibility:visible;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-start;overscroll-behavior:none}
.home-page.next,.home-page.prev{display:none}
.home-bottom-bar{flex-shrink:0;padding:6px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.home-dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:22px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.home-dock .app-cell{gap:4px}
.home-dock .app-ico{width:48px;height:48px;font-size:11px;border-radius:14px}
.home-dock .app-label{font-size:10px}
.grid-title{font-size:11px;color:#666;margin-bottom:6px;flex-shrink:0}
.app-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 4px;align-content:start}
.app-cell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.app-cell.dragging{z-index:999;pointer-events:none;animation:none!important;opacity:.75;transform:scale(1.08);transition:transform .05s}
.app-cell.dragging::before,.app-cell.dragging::after{display:none!important}
.app-ico{width:46px;height:46px;border-radius:13px;background:#fff;color:#555b63;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:10px;font-weight:600;text-align:center;line-height:1.1;padding:3px;box-sizing:border-box}
.app-ico svg{width:22px;height:22px}
.app-ico.text-only{color:#111;font-family:inherit}
.app-ico.text-small{font-size:9px}
.app-ico.emoji{font-size:24px;font-weight:400;line-height:1}
.app-ico.custom-img{padding:0;overflow:hidden}
.app-ico.custom-img img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.app-label{font-size:10px;color:#666;margin-top:2px}
.couple-widget{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:10px 14px;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.couple-avatars{display:flex;justify-content:center;align-items:center;padding:4px 0}
.couple-avatar{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#888;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.couple-avatar:first-child{z-index:2}
.couple-avatar:last-child{margin-left:-12px;z-index:1}
.couple-avatar img{width:100%;height:100%;object-fit:cover}
.couple-avatar svg{width:26px;height:26px}
.couple-text{font-size:12px;color:#666;letter-spacing:2px}
.music-home-widget{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:9px 12px;display:flex;align-items:center;gap:9px;color:#111;margin-bottom:8px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.mhw-disc{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative;border:1px solid rgba(0,0,0,.08)}
.mhw-disc svg{width:20px;height:20px;color:rgba(0,0,0,.55);position:relative;z-index:2}
.mhw-center{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mhw-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhw-artist{font-size:10px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhw-controls{display:flex;align-items:center;gap:12px;margin-top:6px}
.mhw-controls svg{width:14px;height:14px;cursor:pointer;color:#111}
.mhw-controls .mhw-play{width:18px;height:18px}
.mhw-divider{width:1px;height:48px;background:rgba(0,0,0,.08);flex-shrink:0;margin:0 2px}
.mhw-right{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.mhw-avatar-row{display:flex;align-items:center;gap:4px}
.mhw-av{width:28px;height:28px;border-radius:50%;background:#2f6fed;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;overflow:hidden;flex-shrink:0;color:#fff}
.mhw-av:last-child{background:#9b51e0}
.mhw-av img{width:100%;height:100%;object-fit:cover}
.mhw-wavelet{width:24px;height:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mhw-wavelet svg{width:100%;height:100%;color:#07c160}
.mhw-together{font-size:9px;color:#666;text-align:center;white-space:nowrap;line-height:1.2}
.anniversary-widget{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;width:100px;height:100px;box-shadow:0 2px 8px rgba(0,0,0,.04);flex-shrink:0}
.aw-left{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%}
.aw-label{font-size:12px;color:#888;font-weight:500;letter-spacing:1px}
.aw-value{font-size:36px;font-weight:700;color:#111;margin-top:6px;line-height:1}
.inputs-widget{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.aw-input-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.aw-input-row:first-child{justify-content:flex-start}
.aw-avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#888;overflow:hidden}
.aw-avatar svg{width:16px;height:16px}
.aw-input-box{border:1px dashed rgba(0,0,0,.18);border-radius:12px;padding:6px 12px;font-size:11px;color:#666;cursor:pointer;min-width:80px;text-align:center;background:#fafafa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw-input-box.has-text{border-style:solid;color:#111;background:#f5f5f5}
.row-widgets{display:flex;gap:8px;align-items:stretch;margin-bottom:8px;flex-shrink:0}
.row-widgets>.anniversary-widget{margin-bottom:0;flex-shrink:0}
.row-widgets>.inputs-widget{margin-bottom:0;flex:1;min-width:0;justify-content:center}
.home-empty-tip{text-align:center;color:rgba(0,0,0,.35);font-size:13px;padding:60px 20px;line-height:1.8}
.home-page.editing .app-cell,.home-page.editing .couple-widget,.home-page.editing .music-home-widget,.home-page.editing .anniversary-widget,.home-page.editing .inputs-widget{position:relative;animation:homeWiggle .35s ease-in-out infinite alternate}
.home-page.editing .app-cell::before,.home-page.editing .couple-widget::before,.home-page.editing .music-home-widget::before,.home-page.editing .anniversary-widget::before,.home-page.editing .inputs-widget::before{content:"";position:absolute;inset:-2px;border:2px dashed rgba(0,0,0,.4);border-radius:18px;background:rgba(0,0,0,.05);z-index:200;cursor:pointer}
@keyframes homeWiggle{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
#home.theme-dark{background:#111;color:#fff}
#home.theme-dark .couple-widget,#home.theme-dark .anniversary-widget,#home.theme-dark .inputs-widget{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
#home.theme-dark .aw-value{color:#fff}
#home.theme-dark .grid-title,#home.theme-dark .app-label,#home.theme-dark .aw-label{color:rgba(255,255,255,.6)}
#home.theme-dark .app-ico{background:rgba(255,255,255,.92);color:#111}
#home.theme-dark .app-ico.text-only{color:#111}
#home.theme-dark .home-edit-btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
#home.theme-dark .couple-avatar{background:rgba(255,255,255,.15);color:rgba(255,255,255,.75)}
#home.theme-dark .couple-text,#home.theme-dark .aw-input-box{color:rgba(255,255,255,.7)}
#home.theme-dark .aw-avatar{background:rgba(255,255,255,.15);color:rgba(255,255,255,.75)}
#home.theme-dark .aw-input-box{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
#home.theme-dark .home-dock{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}

body.theme-dark .modal{background:#111}
body.theme-dark .modal-bar{background:#1c1c1e;border-bottom-color:#2c2c2e;color:#fff}
body.theme-dark .modal-title,body.theme-dark .modal-bar svg{color:#fff}
body.theme-dark .wx-container,body.theme-dark .wx-content,body.theme-dark .wx-chat-view,body.theme-dark .wx-messages{background:#111}
body.theme-dark .wx-header,body.theme-dark .wx-bottom-bar,body.theme-dark .wx-chat-header,body.theme-dark .wx-chat-input{background:#1c1c1e;border-color:#2c2c2e}
body.theme-dark .wx-header-title,body.theme-dark .wx-name,body.theme-dark .wx-chat-header span{color:#fff}
body.theme-dark .wx-header-actions svg,body.theme-dark .wx-chat-header svg{color:#fff}

body.theme-dark .wx-extra-panel,body.theme-dark .wx-sticker-panel{background:#1c1c1e;border-top-color:#2c2c2e}
body.theme-dark .wx-extra-item .we-ico{background:#2c2c2e;color:#fff}
body.theme-dark .wx-sticker-head .ws-title,body.theme-dark .wx-popup-title{color:#fff}
body.theme-dark .wx-sticker-head .ws-close{background:#2c2c2e;color:#8b9198}
body.theme-dark .wx-quote-bar{background:#2c2c2e;border-top-color:#3a3a3c}
body.theme-dark .settings-page,body.theme-dark .settings-body{background:#111}
body.theme-dark .settings-header{background:#1c1c1e;border-bottom-color:#2c2c2e;color:#fff}
body.theme-dark .settings-header svg,body.theme-dark .settings-header .stitle{color:#fff}
body.theme-dark .settings-block,body.theme-dark .settings-row{background:#1c1c1e;border-bottom-color:#2c2c2e}
body.theme-dark .settings-row .sr-title{color:#fff}
body.theme-dark .settings-input{background:#2c2c2e;color:#fff;border-color:#3a3a3c}
body.theme-dark .simple-app{background:#111;color:#fff}
body.theme-dark .simple-app-header{background:#1c1c1e;border-bottom-color:#2c2c2e;color:#fff}
body.theme-dark .simple-app-header svg,body.theme-dark .simple-app-header .sat{color:#fff}
body.theme-dark .simple-app-body{background:#111}
body.theme-dark .zika-container{background:#111;color:#fff}
body.theme-dark .zika-back{background:#1c1c1e;border-color:#2c2c2e;color:#fff}
body.theme-dark .zika-card{background:#1c1c1e;color:#fff;border-color:#2c2c2e}
body.theme-dark .zika-card .zika-del{background:#2c2c2e;color:#8b9198}
body.theme-dark .zk-tab{background:#1c1c1e;color:#fff;border-color:#2c2c2e}
body.theme-dark .zk-tab.active{background:#fff;color:#1c1c1e;border-color:#fff}
body.theme-dark .zk-tool{background:#1c1c1e;color:#fff;border-color:#2c2c2e}
body.theme-dark .zk-searchbar input{background:#1c1c1e;color:#fff;border-color:#2c2c2e}
body.theme-dark .wx-popup{background:#1c1c1e;color:#fff}
body.theme-dark .wx-popup-input{background:#2c2c2e;color:#fff;border-color:#3a3a3c}
body.theme-dark .wx-popup-opt{background:#2c2c2e;color:#fff;border-color:#3a3a3c}
body.theme-dark .msg-menu{background:#1c1c1e}
body.theme-dark .msg-menu .mm-item{color:#fff}
body.theme-dark .in-app-popup-card{background:rgba(28,28,30,.98)}
body.theme-dark .in-app-popup-title{color:#fff}
body.theme-dark .in-app-popup-text{color:#8b9198}
  .modal{position:fixed;inset:0;z-index:200;background:#fff;display:none;flex-direction:column}
.modal.open{display:flex}
.modal-bar{padding:20px;padding-top:calc(20px + env(safe-area-inset-top));border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}
.modal-bar button{width:36px;height:36px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-bar svg{width:20px;height:20px}
.modal-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.modal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.wx-container{position:absolute;inset:0;display:flex;flex-direction:column;background:#f5f6f8}
.wx-header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-header-title{font-size:17px;font-weight:600}
.wx-header-actions svg{width:22px;height:22px;cursor:pointer}
.wx-content{flex:1;overflow-y:auto;background:#fff}
.wx-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.wx-avatar{width:44px;height:44px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex-shrink:0;overflow:hidden}
.wx-avatar img{width:100%;height:100%;object-fit:cover}
.wx-info{flex:1;min-width:0}
.wx-name{font-size:15px;font-weight:500}
.wx-preview{font-size:13px;color:#8b9198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wx-time{font-size:11px;color:#b0b0b0}
.wx-badge{background:#ff3b30;color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}
.wx-bottom-bar{display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
.wx-bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:#8b9198;cursor:pointer;border:0;background:none;font-family:inherit}
.wx-bottom-tab svg{width:22px;height:22px}
.wx-bottom-tab.active{color:#07c160}
.wx-chat-view{position:absolute;inset:0;background:#f5f6f8;display:flex;flex-direction:column;z-index:10;transform:translateX(100%);transition:transform .3s}
.wx-chat-view.open{transform:translateX(0)}
.wx-chat-header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-chat-header svg{width:22px;height:22px;cursor:pointer}
.wx-chat-header span{font-size:16px;font-weight:600;flex:1;text-align:center}
.wx-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background-size:cover;background-position:center}
.wx-msg-row{display:flex;gap:8px;max-width:80%}
.wx-msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.wx-msg-row.them{align-self:flex-start}
.wx-msg-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.wx-msg-avatar{width:36px;height:36px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden}
.wx-msg-avatar img{width:100%;height:100%;object-fit:cover}
.wx-msg-row.me .wx-msg-avatar{background:#2f6fed}
.wx-msg-meta{font-size:10px;color:#b0b0b0;text-align:center}
.wx-msg-meta .read{color:#07c160;display:block}
.wx-msg-body{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0;max-width:100%}
.wx-msg-row.me .wx-msg-body{align-items:flex-end}
.wx-msg-body>.wx-msg-bubble,.wx-msg-body>.wx-msg-tags{max-width:100%}
.wx-msg-bubble{padding:10px 14px;font-size:15px;line-height:1.4;word-break:break-word;max-width:100%}
.wx-msg-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.wx-msg-tag{padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.05);font-size:11px;color:#666;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.wx-msg-tag .wt-label{color:#999}
.wx-msg-tag .wt-val{color:#333;font-weight:500}
body.theme-dark .wx-msg-tag{background:rgba(255,255,255,.08)}
body.theme-dark .wx-msg-tag .wt-label{color:rgba(255,255,255,.5)}
body.theme-dark .wx-msg-tag .wt-val{color:rgba(255,255,255,.9)}
.wx-chat-input{display:flex;gap:6px;padding:8px 10px;background:#fff;border-top:1px solid #eee;padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:center;position:relative}
.wx-chat-input input{flex:1;border:0;background:#f5f6f8;border-radius:20px;padding:9px 14px;font-size:16px;outline:none;min-width:0}

function startDragApp(cell,startEvent){
var key=cell.dataset.key;if(!key)return;
var t=startEvent.touches?startEvent.touches[0]:startEvent;
_drag={type:'app',id:key,el:cell,startX:t.clientX,startY:t.clientY};
cell.classList.add('dragging');
if(navigator.vibrate)navigator.vibrate(20);
document.addEventListener('touchmove',onDragMove,{passive:false});
document.addEventListener('touchend',onDragEnd);
document.addEventListener('mousemove',onDragMove);
document.addEventListener('mouseup',onDragEnd);
}
function startDragWidget(el,wId,startEvent){
if(!startEvent)return;
var t=startEvent.touches?startEvent.touches[0]:startEvent;
_drag={type:'widget',id:wId,el:el,startX:t.clientX,startY:t.clientY};
el.classList.add('dragging');
if(navigator.vibrate)navigator.vibrate(20);
document.addEventListener('touchmove',onDragMove,{passive:false});
document.addEventListener('touchend',onDragEnd);
document.addEventListener('mousemove',onDragMove);
document.addEventListener('mouseup',onDragEnd);
}
function onDragMove(e){
if(!_drag)return;
var t=e.touches?e.touches[0]:e;
var dx=t.clientX-_drag.startX;
var dy=t.clientY-_drag.startY;
_drag.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08)';
if(e.cancelable)e.preventDefault();
var el=_drag.el;
el.style.pointerEvents='none';
var under=document.elementFromPoint(t.clientX,t.clientY);
el.style.pointerEvents='';
if(_drag.type==='app'){
var target=under?under.closest('.app-cell'):null;
if(target&&target!==_drag.el&&target.dataset.key){swapOrder(_drag.id,target.dataset.key)}
}else if(_drag.type==='widget'){
var target2=under?under.closest('[data-widget-id]'):null;
if(target2&&target2!==_drag.el&&target2.dataset.widgetId){swapWidgetOrder(_drag.id,target2.dataset.widgetId)}
}
}
function onDragEnd(){
if(!_drag)return;
var el=_drag.el;
el.classList.remove('dragging');
el.style.transform='';
_drag=null;
document.removeEventListener('touchmove',onDragMove,{passive:false});
document.removeEventListener('touchend',onDragEnd);
document.removeEventListener('mousemove',onDragMove);
document.removeEventListener('mouseup',onDragEnd);
saveHomePage();
renderHomePages();
}

function exportBackup(){

var data={__meta:{version:1,exportAt:new Date().toISOString()}};
Object.keys(_lsCache).forEach(function(k){
if(k&&k.indexOf('desktop_')===0)data[k]=JSON.stringify(_lsCache[k]);
});
var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='desktop-backup-'+new Date().toISOString().slice(0,10)+'.json';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url)},1000);
}catch(e){alert('导出失败：'+e.message)}

_lsCache[k]=v;

}catch(err){}
});

function startVoiceRecord(cb){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('当前浏览器不支持录音');return}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
_recState.stream=stream;
var mime='';
if(window.MediaRecorder){
if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
else if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
else if(MediaRecorder.isTypeSupported('audio/aac'))mime='audio/aac';
}
try{_recState.recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){_recState.recorder=new MediaRecorder(stream)}
_recState.chunks=[];
_recState.startTs=Date.now();
_recState.recorder.ondataavailable=function(ev){if(ev.data&&ev.data.size>0)_recState.chunks.push(ev.data)};
_recState.recorder.onstop=function(){
var dur=Math.max(1,Math.round((Date.now()-_recState.startTs)/1000));
var blob=new Blob(_recState.chunks,{type:_recState.recorder.mimeType||'audio/webm'});
if(_recState.stream){_recState.stream.getTracks().forEach(function(t){t.stop()});_recState.stream=null}
if(dur<1||blob.size<200){if(cb)cb(null);return}
if(cb)cb({blob:blob,dur:dur});
};
_recState.recorder.start();
}).catch(function(err){alert('无法访问麦克风：'+(err.message||err.name))});
}
function stopVoiceRecord(cancel){
if(!_recState.recorder||_recState.recorder.state==='inactive')return;
try{_recState.recorder.stop()}catch(e){}
if(cancel){_recState.recorder.onstop=null;if(_recState.stream){_recState.stream.getTracks().forEach(function(t){t.stop()});_recState.stream=null}}
}

function buildHisPhoneMirror(){
if(!extraState.hisData)extraState.hisData={music:[],watch:[],store:[],favs:[],moments:[],balance:1000000000000};
var his=extraState.hisData;
var myDisplayName=(wxState.settings.hisRemarkForMe&&wxState.settings.hisRemarkForMe.trim())||(wxState.settings.myName||'我');
var chatList=[];
(wxState.chats||[]).forEach(function(c){
if(!c.msgs||!c.msgs.length)return;
var taMsgs=c.msgs.map(function(m){return{me:!m.me,text:m.text||(m.type==='sticker'?'[表情]':m.type==='image'?'[图片]':m.type==='voice'?'[语音]':m.type==='transfer'?'[转账] ¥'+m.amount:m.type==='call'?(m.text||'[通话]'):m.type==='pat'?m.text:m.type==='questionnaire'?'[问卷] '+m.title:'[...]'),time:m.time}});
chatList.push({name:myDisplayName,color:c.color,last:c.msgs[c.msgs.length-1].text||'',time:c.time||'',msgs:taMsgs});
});
var cdList=(extraState.countdowns||[]).map(function(c){var days=Math.ceil((new Date(c.date+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000);return{name:c.name,date:c.date,days:days}});
return{
wechat:{chats:chatList},
music:{songs:his.music.slice()},
watch:{list:his.watch.slice()},

store:{items:his.store.slice(),balance:his.balance||0},
fav:{list:his.favs.slice()},

};
}

function toggleMusicPlayPlayer(){var a=ensureMusicAudio();if(!extraState.musicList||!extraState.musicList.length){alert('列表为空，请点右上角列表添加歌曲');return}if(extraState.musicIndex<0){playMusicAt(0);return}if(extraState.musicPlaying){a.pause();extraState.musicPlaying=false}else{a.play().catch(function(){});extraState.musicPlaying=true}saveExtra();closeMusicApp();openMusicPlayer()}

function openMusicAddMenu(){openPopup('<div class="wx-popup-title">添加音乐</div><button class="icon-opt-btn" data-act="local" style="width:100%;padding:14px;margin-bottom:8px;border:1px solid #e2e5e9;border-radius:12px;background:#fff;font-size:14px;cursor:pointer;font-family:inherit">📁 从本地导入</button><button class="icon-opt-btn" data-act="url" style="width:100%;padding:14px;border:1px solid #e2e5e9;border-radius:12px;background:#fff;font-size:14px;cursor:pointer;font-family:inherit">🔗 从链接导入（VIP/免费歌/其他软件）</button>');document.querySelectorAll('.icon-opt-btn').forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.act;closePopup();if(a==='local')importLocalMusic();else if(a==='url')importUrlMusic()})})}

function reminderTodayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function fireReminder(text,mood){
var c=proactivePickContact();if(!c)return;
var chat=proactiveEnsureChat(c);
chat.msgs.push({me:false,type:'text',text:text,time:nowTime(),read:true});
chat.time=nowTime().slice(0,5);chat.unread=(chat.unread||0)+1;
saveWxChat();
if(wxState.currentTab==='chats'&&document.getElementById('wxContent'))renderWxContent();
if(wxState.currentChat===chat&&document.getElementById('wxMessages'))renderMsgs();

function checkReminders(){
var now=new Date();var h=now.getHours();var today=reminderTodayKey();
reminderDefs.forEach(function(r){
if(h<r.startH||h>=r.endH)return;
var key=r.key+'_'+today;
if(reminderState.lastFired[key])return;
reminderState.lastFired[key]=true;
var text=r.texts[Math.floor(Math.random()*r.texts.length)];
setTimeout(function(){fireReminder(text,r.mood)},Math.random()*8000);
});
if(h>=8&&h<22){
var wkey='water_'+today+'_'+h;
if(!reminderState.lastFired[wkey]){
reminderState.lastFired[wkey]=true;
var wtexts=['喝点水吧','记得喝水呀','该补充水分啦','喝口水休息一下','别光顾着忙，喝水'];
setTimeout(function(){fireReminder(wtexts[Math.floor(Math.random()*wtexts.length)],'关心你')},Math.random()*10000);
}
}
try{
var p=extraState.period;
if(p&&p.records&&p.records.length){
var sorted=p.records.slice().sort(function(a,b){return b-a});
var last=sorted[0];
var nextDate=last+p.cycle*86400000;
var todayMs=new Date().setHours(0,0,0,0);
var diff=Math.ceil((nextDate-todayMs)/86400000);
var pkey='period_'+today;
if((diff===1||diff===0)&&!reminderState.lastFired[pkey]){
reminderState.lastFired[pkey]=true;
var ptexts=diff===1?['明天可能是经期哦，注意保暖','明天大概要来啦，别着凉','提前准备好红糖水呀']:['今天大概是经期第一天，别累着','经期到啦，多休息','肚子疼要告诉我'];
setTimeout(function(){fireReminder(ptexts[Math.floor(Math.random()*ptexts.length)],'心疼你')},Math.random()*15000);
}
}
}catch(e){}
}

var festivalState={lastFired:{}};
function todayMD(){var d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function checkFestivals(){
if(!proactiveEngine.enabled)return;
var d=new Date();
var md=todayMD();
var year=d.getFullYear();
var todayKey=year+'-'+md;
if(festivalState.lastFired[todayKey])return;
var hit=null;
for(var i=0;i<festivalBuiltin.length;i++){if(festivalBuiltin[i].md===md){hit=festivalBuiltin[i];break}}
if(!hit){
for(var j=0;j<festivalLunar.length;j++){
var f=festivalLunar[j];
if(f.y===year&&f.md===md){hit=f;break}
}
}
if(!hit){
var custom=wxState.settings.customFestivals||[];
for(var k=0;k<custom.length;k++){if(custom[k].md===md){hit=custom[k];break}}
}
if(!hit&&wxState.settings.birthday&&wxState.settings.birthday.slice(5)===md){
hit={name:'你的生日',texts:['生日快乐呀','生日快乐，今天你是主角','生日快乐，愿年年有我陪着你','生日快乐，许个愿吧','生日快乐，我的宝贝']};
}
if(!hit)return;
festivalState.lastFired[todayKey]=true;
var c=proactivePickContact();if(!c)return;
var text;
var pool=(hit.texts&&hit.texts.length)?hit.texts:['节日快乐'];
var zk=proactivePickZika();
if(zk&&Math.random()<0.5){text=zk+'，'+pool[Math.floor(Math.random()*pool.length)]}
else{text=pool[Math.floor(Math.random()*pool.length)]}
var chat=proactiveEnsureChat(c);
chat.msgs.push({me:false,type:'text',text:text,time:nowTime(),read:true});
chat.time=nowTime().slice(0,5);chat.unread=(chat.unread||0)+1;
saveWxChat();
if(wxState.currentTab==='chats'&&document.getElementById('wxContent'))renderWxContent();
if(wxState.currentChat===chat&&document.getElementById('wxMessages'))renderMsgs();
bumpHeart(3);
showInAppPopup({name:c.name,text:text,icon:'节日：'+hit.name});
}

function restartProactiveTimers(){
var t=proactiveEngine.timers;
Object.keys(t).forEach(function(k){if(t[k]){clearInterval(t[k]);t[k]=null}});
proactiveEngine.started=false;
proactiveStartEngine();
}

}catch(e){}
}
}));
})(k);
}
}
return Promise.all(migTasks);
}).then(function(){return localforage.keys();}).then(function(keys){

document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]').forEach(function(l){l.parentNode.removeChild(l)});

<script>
(function(){
function makeIcon(){
try{
var c=document.createElement('canvas');c.width=180;c.height=180;
var x=c.getContext('2d');
var r=40,w=180,h=180;
x.beginPath();
x.moveTo(r,0);
x.arcTo(w,0,w,h,r);
x.arcTo(w,h,0,h,r);
x.arcTo(0,h,0,0,r);
x.arcTo(0,0,w,0,r);
x.closePath();
x.fillStyle='#ffffff';
x.fill();
x.fillStyle='#111111';
x.font='bold 86px "PingFang SC","Helvetica Neue",Arial,sans-serif';
x.textAlign='center';
x.textBaseline='middle';
x.fillText('小羊',90,92);
return c.toDataURL('image/png');
}catch(e){return ''}
}
function apply(){
try{
var url=makeIcon();
if(!url)return;
var links=document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]');
for(var i=0;i<links.length;i++){links[i].parentNode.removeChild(links[i])}
var a=document.createElement('link');a.rel='apple-touch-icon';a.setAttribute('sizes','180x180');a.href=url;document.head.appendChild(a);
var b=document.createElement('link');b.rel='icon';b.type='image/png';b.href=url;document.head.appendChild(b);
}catch(e){}
}
apply();
setTimeout(apply,100);
setTimeout(apply,500);
setTimeout(apply,1500);
})();
</script>
