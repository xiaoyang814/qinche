<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>桌面</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;padding:0;overflow:hidden}body{font-family:-apple-system,"PingFang SC",sans-serif;background:#111;color:#fff}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto}.screen.active{display:flex}
#home{background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);padding:20px;background-size:cover;background-position:center}
.hero{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:20px;margin-bottom:16px;background-size:cover;background-position:center}
.hero-date{font-size:12px;color:rgba(255,255,255,.6)}.hero-title{font-size:24px;font-weight:700;margin-top:6px}
.widget{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:18px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;background-size:cover;background-position:center}
.clock-time{font-size:34px;font-weight:700}.clock-date{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.grid-title{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.app-cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.app-ico{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);background-size:cover;background-position:center;overflow:hidden}.app-ico svg{width:26px;height:26px}.app-ico img{width:100%;height:100%;object-fit:cover}
.app-label{font-size:11px;color:rgba(255,255,255,.6)}
.modal{position:fixed;inset:0;z-index:200;background:#fff;color:#111;display:none;flex-direction:column}
.modal.open{display:flex;animation:slideInRight .34s cubic-bezier(.32,.72,0,1)}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.modal-bar{padding:20px;padding-top:calc(20px + env(safe-area-inset-top));border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}
.modal-bar button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-bar svg{width:20px;height:20px}.modal-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.modal-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
.modal-ico{width:80px;height:80px;border-radius:22px;background:#f5f6f8;display:flex;align-items:center;justify-content:center}.modal-ico svg{width:38px;height:38px}
.modal-body h2{margin:0;font-size:19px}.modal-body p{margin:0;font-size:13px;color:#8b9198}
.wx-container{position:absolute;inset:0;display:flex;flex-direction:column;background:#f5f6f8;overflow:hidden}
.wx-header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-header-title{font-size:17px;font-weight:600}.wx-header-actions{display:flex;gap:12px}.wx-header-actions svg{width:22px;height:22px;color:#111;cursor:pointer}
.wx-content{flex:1;overflow-y:auto;background:#fff}
.wx-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.wx-avatar{width:44px;height:44px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex-shrink:0;overflow:hidden}
.wx-avatar img{width:100%;height:100%;object-fit:cover}
.wx-info{flex:1;min-width:0}.wx-name{font-size:15px;font-weight:500}
.wx-preview{font-size:13px;color:#8b9198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wx-time{font-size:11px;color:#b0b0b0}.wx-badge{background:#ff3b30;color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}
.wx-bottom-bar{display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
.wx-bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:#8b9198;cursor:pointer;border:0;background:none;font-family:inherit}
.wx-bottom-tab svg{width:22px;height:22px}.wx-bottom-tab.active{color:#07c160}
.wx-chat-view{position:absolute;inset:0;background:#f5f6f8;display:flex;flex-direction:column;z-index:10;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.wx-chat-view.open{transform:translateX(0)}
.wx-chat-header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding-top:calc(12px + env(safe-area-inset-top))}
.wx-chat-header svg{width:22px;height:22px;cursor:pointer}.wx-chat-header span{font-size:16px;font-weight:600;flex:1;text-align:center}
.wx-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#ffffff;background-size:cover;background-position:center}
.wx-msg-row{display:flex;gap:8px;max-width:80%}.wx-msg-row.me{align-self:flex-end;flex-direction:row-reverse}.wx-msg-row.them{align-self:flex-start}
.wx-msg-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.wx-msg-avatar{width:36px;height:36px;border-radius:var(--wx-avatar-radius,50%);background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;overflow:hidden}
.wx-msg-avatar img{width:100%;height:100%;object-fit:cover}
.wx-msg-row.me .wx-msg-avatar{background:#2f6fed}
.wx-msg-meta{font-size:10px;color:#b0b0b0;text-align:center}.wx-msg-meta .read{color:#07c160;display:block}
.wx-msg-body{display:flex;flex-direction:column;gap:3px}.wx-msg-row.me .wx-msg-body{align-items:flex-end}.wx-msg-row.them .wx-msg-body{align-items:flex-start}
.wx-msg-bubble{padding:10px 14px;font-size:15px;line-height:1.4;word-break:break-word;max-width:100%}
.wx-msg-img{max-width:180px;max-height:180px;border-radius:10px;display:block}
.wx-chat-input{display:flex;gap:6px;padding:8px 10px;background:#fff;border-top:1px solid #eee;padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:center}
.wx-chat-input input{flex:1;border:0;background:#f5f6f8;border-radius:20px;padding:9px 14px;font-size:15px;outline:none;min-width:0}
.wx-chat-input .icon-btn{width:34px;height:34px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wx-chat-input .icon-btn svg{width:22px;height:22px;color:#555}
.wx-chat-input .send-btn{background:#111418;color:#fff;border:0;border-radius:18px;padding:9px 18px;font-size:15px;cursor:pointer;font-weight:500;flex-shrink:0}
.wx-chat-input .send-btn:disabled{opacity:.4}
.wx-emoji-panel{display:none;flex-direction:column;background:#fff;border-top:1px solid #eee;max-height:240px}
.wx-emoji-panel.show{display:flex}
.wx-emoji-tabs{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid #f0f0f0;background:#fafafa;flex-shrink:0}
.wx-emoji-tab{font-size:13px;color:#8b9198;padding:5px 12px;border-radius:14px;cursor:pointer;user-select:none}
.wx-emoji-tab.active{background:#fff;color:#111;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.wx-emoji-body{flex:1;overflow-y:auto;padding:10px 12px}
.wx-emoji-content,.wx-sticker-content{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.hide{display:none !important}
.wx-emoji-item{font-size:24px;padding:4px;cursor:pointer;border-radius:6px}
.wx-sticker-item{width:56px;height:56px;border-radius:8px;background:#f5f6f8;object-fit:cover;cursor:pointer}
.wx-sticker-add{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border:1px dashed #ccc;border-radius:8px;color:#8b9198;font-size:22px;cursor:pointer;background:#fafafa}
.wx-sticker-empty{width:100%;padding:20px 10px;text-align:center;color:#8b9198;font-size:13px}
.wx-func-panel{display:none;flex-wrap:wrap;padding:16px 6px 12px;background:#f7f7f7;border-top:1px solid #e5e5e5;justify-content:center}
.wx-func-panel.show{display:flex}
.wx-func-item{width:33%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;cursor:pointer}
.wx-func-item .fi-icon{width:56px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.wx-func-item .fi-icon svg{width:28px;height:28px;color:#333}
.wx-func-item .fi-label{font-size:12px;color:#666}
.wx-func-item:active .fi-icon{background:#ececec}
.wx-survey-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:12px 14px;min-width:200px;max-width:260px;text-align:left}
.wx-survey-card .sv-title{font-size:15px;color:#111;font-weight:500;margin-bottom:6px;line-height:1.4}
.wx-survey-card .sv-qtype{font-size:11px;color:#8b9198;margin-bottom:8px}
.wx-survey-card .sv-option{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14px;color:#333}
.wx-survey-card .sv-option.selected{color:#07c160;font-weight:500}
.wx-survey-card .sv-option .mark{font-size:14px}
.wx-survey-card .sv-text{font-size:13px;color:#07c160;padding:6px 0;border-top:1px dashed #eee;margin-top:6px}
.wx-survey-card .sv-footer{font-size:11px;color:#b0b0b0;margin-top:8px;border-top:1px solid #f0f0f0;padding-top:6px}
.wx-call-card{text-align:center;font-size:12px;color:#8b9198;background:#e9ecf1;border-radius:14px;padding:6px 14px;display:inline-block}
.wx-moments-hero{position:relative;height:230px;background:linear-gradient(135deg,#e8e2f5,#d5e8ef,#e0f0e8);overflow:hidden;background-size:cover;background-position:center}
.wx-moments-hero img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.wx-moments-hero .hero-icons{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;padding:0 16px;gap:16px;color:#fff;z-index:2}
.wx-moments-hero .hero-icons .left{display:flex;flex:1}

.wx-moments-hero .hero-icons .change-bg{background:rgba(255,255,255,.5);color:#111;border:0;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}
.wx-moments-hero .hero-avatar-row{position:absolute;bottom:14px;right:16px;display:flex;align-items:flex-end;gap:8px;z-index:2}
.wx-moments-hero .hero-avatar-row .nickname{color:#fff;font-size:17px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.5);padding-bottom:8px}
.wx-moments-hero .hero-avatar-row .wx-avatar{width:80px;height:80px;font-size:30px;border-radius:14px;border:3px solid #fff;background:#2f6fed;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden}
.wx-moments-hero .hero-avatar-row .wx-avatar img{width:100%;height:100%;object-fit:cover}
.wx-moments-empty{padding:80px 20px;text-align:center;color:#c3c8ce;font-size:14px}
.wx-moments-watermark{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:16px;background:#1c1c1e;color:#fff;border-radius:20px;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:6px;z-index:500;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.wx-moments-watermark .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#a66cff,#4d96ff,#2eb872)}
.wx-moments-watermark .close{font-size:14px;opacity:.7;margin-left:4px;cursor:pointer}
.wx-moment-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid #f0f0f0;background:#fff}
.wx-moment-avatar{width:44px;height:44px;border-radius:var(--wx-avatar-radius,10px);background:#2f6fed;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;flex-shrink:0;overflow:hidden}
.wx-moment-avatar img{width:100%;height:100%;object-fit:cover}
.wx-moment-content{flex:1;min-width:0}.wx-moment-name{font-size:15px;font-weight:600;color:#576b95}
.wx-moment-text{font-size:15px;color:#111;margin:6px 0;line-height:1.5}
.wx-moment-imgs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.wx-moment-imgs img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.wx-moment-time{font-size:12px;color:#b0b0b0;margin-top:4px}
.wx-moment-actions{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px}
.wx-moment-actions span{cursor:pointer;display:flex;align-items:center;justify-content:center;background:#f5f6f8;border-radius:6px;min-width:36px;height:24px;padding:0 8px;font-size:15px;color:#576b95;letter-spacing:1px;font-weight:bold}
.wx-moment-actions span:active{background:#e9ebef}
.wx-moment-interact{background:#f5f6f8;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:14px;line-height:1.6}
.wx-moment-interact .likes{color:#576b95}.wx-moment-interact .likes .heart{color:#ff3b30;margin-right:4px}
.wx-moment-interact .comments{margin-top:6px;padding-top:6px;border-top:1px solid #e8eaed;color:#111}
.wx-moment-interact .comments:first-child{margin-top:0;padding-top:0;border-top:0}
.wx-moment-interact .comments .cname{color:#576b95;font-weight:500;margin-right:4px}
.wx-empty{padding:40px;text-align:center;color:#8b9198;font-size:13px}
.wx-menu-btn{width:36px;height:36px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wx-menu-btn svg{width:22px;height:22px;color:#111}
.wx-bubble-menu{position:fixed;z-index:1300;background:#4c4c4c;border-radius:8px;padding:4px;display:flex;box-shadow:0 4px 16px rgba(0,0,0,.28);animation:bubbleIn .16s ease-out}
@keyframes bubbleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.wx-bubble-menu .bm-item{color:#fff;font-size:14px;padding:7px 18px;cursor:pointer;border-radius:6px;white-space:nowrap}
.wx-bubble-menu .bm-item:active{background:rgba(255,255,255,.15)}
.wx-bubble-mask{position:fixed;inset:0;z-index:1250;background:transparent}
.settings-page{position:fixed;inset:0;background:#fff;color:#111;display:none;flex-direction:column;z-index:1000;overflow:hidden}
.settings-page.open{display:flex;animation:slideInRight .32s cubic-bezier(.32,.72,0,1)}
.settings-header{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;background:#fff}
.settings-header svg{width:22px;height:22px;cursor:pointer}.settings-header .stitle{font-size:17px;font-weight:600;flex:1;text-align:center}
.settings-body{flex:1;overflow-y:auto;padding:16px;background:#f5f6f8;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.settings-block{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.settings-block h4{margin:0 0 10px;font-size:14px;font-weight:600}.settings-block p{margin:0 0 8px;font-size:12px;color:#8b9198}
.settings-slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#e2e5e9;outline:none}
.settings-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#07c160;cursor:pointer}
.settings-avatar-preview{width:70px;height:70px;margin:0 auto 12px;background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;border-radius:var(--wx-avatar-radius,50%);background-size:cover;background-position:center;overflow:hidden}
.settings-switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.settings-switch-btn{width:44px;height:26px;border-radius:13px;background:#dfe2e6;position:relative;cursor:pointer;border:0;padding:0}
.settings-switch-btn::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.settings-switch-btn.on{background:#07c160}.settings-switch-btn.on::after{transform:translateX(18px)}
.settings-input{width:100%;border:1px solid #e2e5e9;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;font-family:inherit;background:#fff;margin-bottom:8px}
.settings-group-label{font-size:13px;color:#8b9198;padding:6px 4px 8px;font-weight:500}
.settings-card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;font-size:15px;border-bottom:1px solid #f0f0f0;gap:12px}
.settings-row:last-child{border-bottom:0}.settings-row:active{background:#f7f8fa}
.settings-row .sr-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.settings-row .sr-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#555;flex-shrink:0;font-size:16px}
.settings-row .sr-title{font-size:15px;color:#111;font-weight:400}
.settings-row .sr-value{font-size:14px;color:#8b9198;flex-shrink:0}
.wx-popup-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1200;display:none;align-items:center;justify-content:center;padding:20px}
.wx-popup-mask.show{display:flex}
.wx-popup{background:#fff;border-radius:18px;width:100%;max-width:360px;padding:20px;color:#111;max-height:80vh;overflow-y:auto}
.wx-popup-title{font-size:16px;font-weight:600;text-align:center;margin-bottom:16px}
.wx-popup-input{width:100%;border:1px solid #e2e5e9;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;margin-bottom:14px;font-family:inherit}
.wx-popup-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.wx-popup-opt{padding:8px 18px;border-radius:18px;border:1px solid #e2e5e9;font-size:14px;color:#111;cursor:pointer;background:#fff;transition:all .15s}
.wx-popup-opt.active{border-color:#f5b8b8;background:#fff0f0;color:#e05a5a;font-weight:500}
.wx-popup-colors{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;justify-content:center}
.wx-popup-color{width:42px;height:42px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.wx-popup-custom{display:block;margin:0 auto 18px;padding:8px 18px;border:1px solid #e2e5e9;border-radius:18px;background:#fff;font-size:14px;color:#111;cursor:pointer}
.wx-popup-btns{display:flex;gap:12px}
.wx-popup-btn{flex:1;padding:12px 0;border:0;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.wx-popup-btn.cancel{background:#f5f6f8;color:#111}.wx-popup-btn.confirm{background:#fde0e0;color:#e05a5a}
.wx-popup-slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#e2e5e9;outline:none;margin:10px 0}
.wx-popup-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fde0e0;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.wx-popup-preview{background:#f7f8fa;border-radius:14px;padding:20px;margin-bottom:18px;display:flex;align-items:center;justify-content:center}
.wx-popup-preview .pv{border-radius:14px;background:#fff;border:1px solid #eee;padding:10px 16px;font-size:14px}
.wx-popup-textarea{width:100%;border:1px solid #e2e5e9;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;margin-bottom:18px;font-family:inherit;resize:none;min-height:140px;line-height:1.5}
.wx-popup-hint{font-size:12px;color:#8b9198;line-height:1.6;margin-bottom:12px}
.call-screen{position:fixed;inset:0;z-index:600;background:#1c1c1e;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(80px + env(safe-area-inset-top)) 20px 60px;transition:all .3s}
.call-screen.open{display:flex}
.call-screen.minimized{inset:calc(14px + env(safe-area-inset-top)) 14px auto auto;width:130px;height:44px;padding:0 12px;background:#fff;color:#111;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2);flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;cursor:pointer;border:0}
.call-screen.minimized .minimize-btn{display:none}
.call-screen.minimized .call-top{flex-direction:row;align-items:center;gap:8px;flex:1;min-width:0}

function renderZikaTags(){var tagsEl=document.getElementById('zikaTags');if(!tagsEl)return;var groups=['主字卡','颜文字','emoji','表情包','图片','拍一拍','语音','梦角自由造句'];tagsEl.innerHTML=groups.map(function(g){var cnt=g==='主字卡'?zikaState.list.length:(g==='表情包'?60:0);return '<div class="zika-tag'+(g==='主字卡'?' active':'')+'" data-g="'+g+'">'+g+'<span class="zika-count">'+cnt+'</span></div>'}).join('');var filtersEl=document.getElementById('zikaFilters');if(filtersEl){filtersEl.innerHTML='<div class="zika-filter active" data-f="全部">全部 ('+zikaState.list.length+')</div><div class="zika-filter" data-f="未分组">未分组 ('+zikaState.list.length+')</div>';filtersEl.querySelectorAll('.zika-filter').forEach(function(el){el.addEventListener('click',function(){filtersEl.querySelectorAll('.zika-filter').forEach(function(x){x.classList.remove('active')});el.classList.add('active');zikaState.filter=el.dataset.f;renderZikaList()})})}}
function renderZikaList(){var listEl=document.getElementById('zikaList');if(!listEl)return;var list=zikaState.list.slice();if(zikaState.search){list=list.filter(function(c){return c.text.indexOf(zikaState.search)>-1})}if(!list.length){listEl.innerHTML='<div class="zika-empty">还没有字卡，点击「管理字卡」添加</div>';var cnt=document.getElementById('zikaCount');if(cnt)cnt.textContent='0';return}listEl.innerHTML=list.map(function(c,i){return '<div class="zika-card" data-i="'+i+'">'+esc(c.text)+'<button class="zika-del" data-i="'+i+'">×</button></div>'}).join('');var cnt=document.getElementById('zikaCount');if(cnt)cnt.textContent=list.length;listEl.querySelectorAll('.zika-del').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var i=parseInt(btn.dataset.i,10);var text=list[i].text;if(!confirm('删除这条字卡？\n\n'+text))return;var idx=zikaState.list.findIndex(function(c){return c.text===text});if(idx>-1)zikaState.list.splice(idx,1);saveZika();renderZikaTags();renderZikaList()})});listEl.querySelectorAll('.zika-card').forEach(function(card){card.addEventListener('click',function(e){if(e.target.closest('.zika-del'))return;var text=card.firstChild.textContent.trim();try{navigator.clipboard.writeText(text);var old=card.style.background;card.style.background='#e8f5e9';setTimeout(function(){card.style.background=old},300)}catch(err){alert(text)}})})}

function zikaBatchImport(){var text=prompt('批量导入字卡（每行一条）：');if(!text)return;var lines=text.split('\n').map(function(s){return s.trim()}).filter(Boolean);if(!lines.length)return;lines.forEach(function(l){zikaState.list.push({group:'未分组',text:l})});saveZika();renderZikaTags();renderZikaList();alert('成功导入 '+lines.length+' 条')}
function zikaExport(){var data=JSON.stringify({list:zikaState.list},null,2);try{var blob=new Blob([data],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='zika-export.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}catch(e){prompt('复制以下数据保存：',data)}}
function zikaImport(){var input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d&&Array.isArray(d.list)){zikaState.list=zikaState.list.concat(d.list);saveZika();renderZikaTags();renderZikaList();alert('成功导入 '+d.list.length+' 条')}}catch(err){alert('文件格式错误')}};reader.readAsText(file)};input.click()}
function zikaDedup(){var seen={};var newList=[];zikaState.list.forEach(function(c){if(!seen[c.text]){seen[c.text]=1;newList.push(c)}});var removed=zikaState.list.length-newList.length;if(!removed){alert('没有重复的字卡');return}zikaState.list=newList;saveZika();renderZikaTags();renderZikaList();alert('已去重 '+removed+' 条')}
function zikaClearAll(){if(!confirm('确定清除全部字卡？此操作不可恢复！'))return;zikaState.list=[];saveZika();renderZikaTags();renderZikaList()}

function openMusicApp(){modalTitle.textContent='一起听歌';modalBody.className='';modalBody.innerHTML=buildMusicHtml();bindMusicEvents();if(!musicPartner.name)musicPartner=pickMusicPartner();var mc=document.getElementById('musicContainer');if(mc&&wxState.settings.musicBgUrl){mc.style.backgroundImage='url('+wxState.settings.musicBgUrl+')';mc.style.backgroundSize='cover';mc.style.backgroundPosition='center'}renderMusicUI();renderMusicChat();renderMusicPlaylist();updateMusicMini()}
function bindMusicEvents(){var back=document.getElementById('musicBack');if(back)back.addEventListener('click',function(){document.getElementById('appModal').classList.remove('open');updateMusicMini()});var openList=document.getElementById('musicOpenList');if(openList)openList.addEventListener('click',function(){renderMusicPlaylist();document.getElementById('musicPlaylist').classList.add('show')});var plBack=document.getElementById('musicPlBack');if(plBack)plBack.addEventListener('click',function(){document.getElementById('musicPlaylist').classList.remove('show')});var addLocal=document.getElementById('musicPlAddLocal');if(addLocal)addLocal.addEventListener('click',addLocalMusic);var addUrl=document.getElementById('musicPlAddUrl');if(addUrl)addUrl.addEventListener('click',openMusicUrlPopup);var prev=document.getElementById('musicPrev');if(prev)prev.addEventListener('click',function(){if(!musicState.playlist.length)return;playMusicAt(musicState.currentIndex-1)});var next=document.getElementById('musicNext');if(next)next.addEventListener('click',function(){if(!musicState.playlist.length)return;playMusicAt(musicState.currentIndex+1)});var pp=document.getElementById('musicPlayPause');if(pp)pp.addEventListener('click',function(){if(!musicState.playlist.length){alert('播放列表为空，先添加歌曲吧');return}if(musicState.currentIndex<0){playMusicAt(0);return}var a=ensureAudio();if(musicState.playing)a.pause();else a.play().catch(function(err){console.warn('播放失败',err)})});var prog=document.getElementById('musicProgress');if(prog)prog.addEventListener('input',function(){if(!musicAudio||!musicAudio.duration)return;musicAudio.currentTime=musicAudio.duration*(parseFloat(this.value)/100)});var loop=document.getElementById('musicLoopBtn');if(loop)loop.addEventListener('click',function(){var modes=['list','single','random'];var idx=(modes.indexOf(musicState.loopMode||'list')+1)%modes.length;musicState.loopMode=modes[idx];this.innerHTML=getLoopIcon(musicState.loopMode);var labels={list:'列表循环',single:'单曲循环',random:'随机播放'};alert('已切换为：'+labels[musicState.loopMode])});var like=document.getElementById('musicLikeBtn');if(like)like.addEventListener('click',function(){this.classList.toggle('active');var num=this.querySelector('.num');if(this.classList.contains('active')){num.textContent='1000w+';num.style.color='#ff3b30'}else{num.textContent='999w+';num.style.color=''}});var comment=document.getElementById('musicCommentBtn');if(comment)comment.addEventListener('click',function(){var bar=document.getElementById('musicChatInputBar');bar.classList.toggle('show');if(bar.classList.contains('show')){document.getElementById('musicChatInput').focus()}});var chatInput=document.getElementById('musicChatInput');var chatSend=document.getElementById('musicChatSendBtn');if(chatSend)chatSend.addEventListener('click',sendMusicChatMsg);if(chatInput)chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendMusicChatMsg()}});var mini=document.getElementById('musicMini');if(mini)mini.addEventListener('click',function(e){if(e.target.closest('#musicMiniClose'))return;openMusicApp();document.getElementById('appModal').classList.add('open')});var miniTog=document.getElementById('musicMiniToggle');if(miniTog)miniTog.addEventListener('click',function(e){e.stopPropagation();if(!musicState.playlist.length)return;if(musicState.currentIndex<0){playMusicAt(0);return}var a=ensureAudio();if(musicState.playing)a.pause();else a.play().catch(function(){})});var miniClose=document.getElementById('musicMiniClose');if(miniClose)miniClose.addEventListener('click',function(e){e.stopPropagation();if(musicAudio)musicAudio.pause();musicState.playing=false;updateMusicMini()})}
function sendMusicChatMsg(){var input=document.getElementById('musicChatInput');if(!input)return;var text=input.value.trim();if(!text)return;musicState.chatMsgs.push({me:true,text:text,time:Date.now()});input.value='';document.getElementById('musicChatInputBar').classList.remove('show');renderMusicChat();setTimeout(function(){var replies=['嗯嗯','我也是','哈哈哈','挺好的','收到~','确实','+1'];var reply=replies[Math.floor(Math.random()*replies.length)];musicState.chatMsgs.push({me:false,text:reply,time:Date.now()});renderMusicChat()},1000+Math.random()*1000)}
function renderMusicChat(){var leftArea=document.getElementById('musicChatLeft');var rightArea=document.getElementById('musicChatRight');if(!leftArea||!rightArea)return;var leftHtml='';var rightHtml='';musicState.chatMsgs.forEach(function(m){if(m.me){leftHtml+='<div class="music-chat-bubble">'+esc(m.text)+'</div>'}else{rightHtml+='<div class="music-chat-bubble">'+esc(m.text)+'</div>'}});leftArea.innerHTML=leftHtml;rightArea.innerHTML=rightHtml;var wrap=document.getElementById('musicChatArea');if(wrap)wrap.scrollTop=wrap.scrollHeight}
function addLocalMusic(){var input=document.createElement('input');input.type='file';input.accept='audio/*';input.multiple=true;input.onchange=function(e){var files=Array.prototype.slice.call(e.target.files||[]);if(!files.length)return;var loaded=0;files.forEach(function(file){var reader=new FileReader();reader.onload=function(ev){musicState.playlist.push({id:'m'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:file.name.replace(/\.[^.]+$/,''),artist:'本地文件',src:ev.target.result,type:'local'});loaded++;if(loaded===files.length){saveMusicState();renderMusicPlaylist();renderMusicUI();if(musicState.currentIndex<0&&musicState.playlist.length)playMusicAt(0)}};reader.onerror=function(){loaded++;if(loaded===files.length){saveMusicState();renderMusicPlaylist()}};reader.readAsDataURL(file)})};input.click()}
function openMusicUrlPopup(){var html='<div class="wx-popup-title">添加网络歌曲</div><input class="wx-popup-input" id="mUrlName" placeholder="歌曲名称（必填）" value=""/><input class="wx-popup-input" id="mUrlArtist" placeholder="歌手（可选）" value=""/><input class="wx-popup-input" id="mUrlSrc" placeholder="音频 URL，如 https://.../song.mp3" value=""/><div class="wx-popup-hint">支持 mp3 / m4a / ogg / wav 等浏览器可播放格式。VIP 加密歌曲请使用「本地文件」导入。</div><div class="wx-popup-btns"><button class="wx-popup-btn cancel" id="mUrlCancel">取消</button><button class="wx-popup-btn confirm" id="mUrlOk">添加</button></div>';openPopup(html);document.getElementById('mUrlCancel').addEventListener('click',closePopup);document.getElementById('mUrlOk').addEventListener('click',function(){var name=(document.getElementById('mUrlName').value||'').trim();var artist=(document.getElementById('mUrlArtist').value||'').trim()||'网络';var src=(document.getElementById('mUrlSrc').value||'').trim();if(!name){alert('请填写歌曲名称');return}if(!src){alert('请填写音频 URL');return}musicState.playlist.push({id:'m'+Date.now(),name:name,artist:artist,src:src,type:'url'});saveMusicState();closePopup();renderMusicPlaylist();renderMusicUI();if(musicState.currentIndex<0&&musicState.playlist.length)playMusicAt(0)})}
function playMusicAt(index){var list=musicState.playlist;if(!list.length)return;if(index<0)index=list.length-1;if(index>=list.length)index=0;musicState.currentIndex=index;var song=list[index];saveMusicState();renderMusicUI();renderMusicPlaylist();if(!song.src)return;var a=ensureAudio();a.src=song.src;var p=document.getElementById('musicProgress');if(p)p.value=0;var cur=document.getElementById('musicCur');if(cur)cur.textContent='00:00';var dur=document.getElementById('musicDur');if(dur)dur.textContent='00:00';musicListenStartTime=Date.now();a.play().catch(function(err){console.warn('播放失败',err)});updateMusicMini()}
function refreshMusicPlayBtn(){var btn=document.getElementById('musicPlayPause');if(!btn)return;if(musicState.playing){btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'}else{btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'}}
function updateMusicWave(){var disc=document.getElementById('musicDisc');if(disc)disc.classList.toggle('playing',musicState.playing)}
function renderMusicUI(){var song=musicState.playlist[musicState.currentIndex];var titleEl=document.getElementById('musicTitle');if(!titleEl)return;titleEl.textContent=song?song.name:'未选择歌曲';var np=document.getElementById('musicNowPlaying');if(np)np.textContent=song?('♪ '+song.name+(song.artist?' - '+song.artist:'')):'未选择歌曲';document.getElementById('musicArtist').textContent=song?(song.artist||'未知'):'—';var myAv=document.getElementById('musicMyAv');if(myAv){if(wxState.settings.myAvatarUrl){myAv.innerHTML='<img src="'+wxState.settings.myAvatarUrl+'"/>'}else{myAv.textContent=(wxState.settings.myName||'我').slice(0,1)}}var pa=document.getElementById('musicPartnerAv');if(pa){if(wxState.settings.partnerAvatarUrl){pa.innerHTML='<img src="'+wxState.settings.partnerAvatarUrl+'"/>'}else{pa.textContent=(musicPartner.name||'友').slice(0,1)}pa.style.background=musicPartner.color||'#9b51e0'}updateMusicWave();refreshMusicPlayBtn();updateMusicMini();var cover=document.getElementById('musicDiscCover');if(cover){if(song&&song.cover)cover.innerHTML='<img src="'+song.cover+'"/>';else cover.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'}}
function renderMusicPlaylist(){var body=document.getElementById('musicPlBody');if(!body)return;if(!musicState.playlist.length){body.innerHTML='<div style="padding:60px 20px;text-align:center;color:#8b9198;font-size:14px">播放列表为空<br><br>点击下方「本地文件」或「URL 添加」</div>';return}body.innerHTML=musicState.playlist.map(function(s,i){return '<div class="music-pl-item'+(i===musicState.currentIndex?' active':'')+'" data-i="'+i+'"><div class="pl-info"><div class="pl-name">'+esc(s.name)+'</div><div class="pl-src">'+(s.type==='local'?'本地文件':'网络')+' · '+esc(s.artist||'未知')+'</div></div><button class="pl-del" data-del="'+i+'">×</button></div>'}).join('')+'<div style="padding:10px;font-size:11px;color:#b0b0b0;text-align:center;background:#121212">点歌曲播放，点 × 删除</div>';body.querySelectorAll('.music-pl-item').forEach(function(item){item.addEventListener('click',function(e){if(e.target.closest('.pl-del'))return;playMusicAt(parseInt(item.dataset.i,10))})});body.querySelectorAll('.pl-del').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var i=parseInt(btn.dataset.del,10);var song=musicState.playlist[i];if(!song)return;if(!confirm('删除「'+song.name+'」？'))return;musicState.playlist.splice(i,1);if(musicState.currentIndex===i){if(musicAudio){musicAudio.pause();musicAudio.src=''}musicState.currentIndex=musicState.playlist.length?0:-1;if(musicState.currentIndex>=0)playMusicAt(0);else{musicState.playing=false;renderMusicUI()}}else if(musicState.currentIndex>i){musicState.currentIndex--}saveMusicState();renderMusicPlaylist();renderMusicUI()})})}
function updateMusicMini(){var mini=document.getElementById('musicMini');if(!mini)return;var song=musicState.playlist[musicState.currentIndex];if(!song||!musicAudio||(!musicAudio.src&&!musicState.playing)){mini.classList.remove('show');return}if(!musicState.playing&&!musicAudio.src){mini.classList.remove('show');return}mini.classList.add('show');document.getElementById('musicMiniName').textContent=song.name;document.getElementById('musicMiniStatus').textContent=(musicState.playing?'正在播放 · ':'已暂停 · ')+(musicPartner.name?('与 '+musicPartner.name+' 一起听'):'');var cover=document.getElementById('musicMiniCover');if(cover)cover.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';var btn=document.getElementById('musicMiniToggle');if(btn){if(musicState.playing)btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';else btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'}}

function openSimpleApp(title,bodyHtml){var html='<div class="simple-app"><div class="simple-app-header"><svg id="saBack" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg><div class="sat">'+title+'</div></div><div class="simple-app-body">'+bodyHtml+'</div></div>';document.body.insertAdjacentHTML('beforeend',html);document.getElementById('saBack').addEventListener('click',function(){document.querySelectorAll('.simple-app').forEach(function(el){el.remove()})})}
function openWatchApp(){var items=[{t:'你和 TA 的私人影院',s:'最近一起看的 3 部剧'},{t:'《请回答1988》',s:'已看 20 集'},{t:'《爱在黎明破晓前》',s:'待看'},{t:'《你的名字》',s:'已看'},{t:'《海街日记》',s:'待看'}];var html=items.map(function(it){return'<div class="simple-item"><div style="font-weight:600">'+it.t+'</div><div style="font-size:12px;color:#8b9198;margin-top:4px">'+it.s+'</div></div>'}).join('');openSimpleApp('观影',html)}
function openHisPhoneApp(){var html='<div class="simple-item"><div style="font-weight:600;margin-bottom:6px">📱 主屏幕</div><div style="font-size:13px;color:#666">今天 09:30 打开过微信</div></div><div class="simple-item"><div style="font-weight:600;margin-bottom:6px">📸 相册</div><div style="font-size:13px;color:#666">最近新增 3 张照片</div></div><div class="simple-item"><div style="font-weight:600;margin-bottom:6px">🎵 音乐</div><div style="font-size:13px;color:#666">正在听：我怀念的</div></div><div class="simple-item"><div style="font-weight:600;margin-bottom:6px">💬 微信</div><div style="font-size:13px;color:#666">3 条未读消息</div></div>';openSimpleApp('他的手机',html)}
function openMailApp(){loadExtra();var html=extraState.mails.map(function(m,i){return'<div class="simple-item" data-mail="'+i+'"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:600">'+esc(m.subject)+'</div>'+(m.read?'':'<span style="width:8px;height:8px;border-radius:50%;background:#ff3b30"></span>')+'</div><div style="font-size:12px;color:#8b9198;margin-top:4px">'+esc(m.from)+' · '+esc(m.time)+'</div></div>'}).join('')||'<div style="padding:40px;text-align:center;color:#8b9198">收件箱为空</div>';openSimpleApp('邮箱',html);document.querySelectorAll('.simple-app .simple-item[data-mail]').forEach(function(el){el.addEventListener('click',function(){var i=parseInt(el.dataset.mail,10);var m=extraState.mails[i];if(!m)return;m.read=true;saveExtra();alert('【'+m.subject+'】\n\n'+m.body);document.querySelectorAll('.simple-app').forEach(function(x){x.remove()});openMailApp()})})}
function openFavApp(){loadExtra();var html=extraState.favs.map(function(f,i){return'<div class="simple-item" data-fav="'+i+'">'+esc(f)+'</div>'}).join('')+'<button class="wx-popup-custom" id="favAddBtn" style="width:100%;margin-top:10px">+ 添加收藏</button>';openSimpleApp('收藏',html);var add=document.getElementById('favAddBtn');if(add)add.addEventListener('click',function(){var t=prompt('输入要收藏的内容：');if(!t)return;extraState.favs.push(t.trim());saveExtra();document.querySelectorAll('.simple-app').forEach(function(x){x.remove()});openFavApp()})}
function openCountdownApp(){loadExtra();var html=extraState.countdowns.map(function(c,i){var days=Math.ceil((new Date(c.date)-new Date())/86400000);return'<div class="simple-item"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:600">'+esc(c.name)+'</div><div style="font-size:22px;font-weight:700;color:#9b51e0">'+(days>=0?days:'已过')+'</div></div><div style="font-size:12px;color:#8b9198;margin-top:4px">'+esc(c.date)+'</div></div>'}).join('')+'<button class="wx-popup-custom" id="cdAddBtn" style="width:100%;margin-top:10px">+ 添加倒数日</button>';openSimpleApp('倒数日',html);var add=document.getElementById('cdAddBtn');if(add)add.addEventListener('click',function(){var n=prompt('纪念日名称：');if(!n)return;var d=prompt('日期（格式：2026-12-25）：');if(!d)return;extraState.countdowns.push({name:n.trim(),date:d.trim()});saveExtra();document.querySelectorAll('.simple-app').forEach(function(x){x.remove()});openCountdownApp()})}

function openStoreApp(){loadExtra();var html=extraState.store.map(function(s,i){return'<div class="simple-item"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:600">'+esc(s.name)+'</div><div style="font-size:13px;color:#e05a5a;font-weight:600">'+esc(s.price)+'</div></div><div style="font-size:12px;color:#8b9198;margin-top:4px">'+esc(s.desc)+'</div></div>'}).join('');openSimpleApp('商店',html)}
